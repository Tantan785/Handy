<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Messages | Handy</title>

    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --green-950: #10251d;
            --green-900: #17382b;
            --green-850: #1c4434;
            --green-700: #2e624c;

            --cream: #f4f1e9;
            --cream-light: #faf9f5;
            --white: #ffffff;

            --text: #17231e;
            --text-soft: #66716b;
            --border: rgba(23, 56, 43, 0.13);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: var(--cream-light);
            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* HEADER */

        .chat-header {
            height: 76px;

            padding: 0 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: var(--cream-light);

            border-bottom: 1px solid var(--border);
        }

        .chat-logo {
            width: 165px;
            display: block;
        }

        .chat-back {
            min-height: 40px;

            padding: 0 15px;

            border: 1px solid var(--border);
            border-radius: 6px;

            background: var(--white);
            color: var(--green-900);

            font-size: 12px;
            font-weight: 650;
        }

        .chat-back:hover {
            background: var(--cream);
        }

        /* MAIN */

        .chat-page {
            min-height: calc(100vh - 76px);

            display: flex;
            justify-content: center;

            padding: 30px 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;

            height: calc(100vh - 136px);

            min-height: 500px;

            display: flex;

            background: var(--white);

            border: 1px solid var(--border);
            border-radius: 10px;

            overflow: hidden;

            box-shadow:
                0 18px 50px
                rgba(16, 37, 29, 0.07);
        }

        /* CONVERSATIONS */

        .conversation-list {
            width: 280px;

            flex-shrink: 0;

            border-right: 1px solid var(--border);

            background: var(--cream-light);
        }

        .conversation-header {
            height: 65px;

            padding: 0 20px;

            display: flex;
            align-items: center;

            border-bottom: 1px solid var(--border);
        }

        .conversation-header h2 {
            margin: 0;

            font-size: 16px;
            font-weight: 650;

            color: var(--green-950);
        }

        .conversation-items {
            overflow-y: auto;

            height: calc(100% - 65px);
        }

        .conversation-item {
            width: 100%;

            padding: 15px 18px;

            display: flex;
            align-items: center;

            gap: 12px;

            border: 0;
            border-bottom: 1px solid var(--border);

            background: transparent;

            text-align: left;

            transition:
                background 0.2s ease;
        }

        .conversation-item:hover {
            background: var(--white);
        }

        .conversation-item.active {
            background: var(--white);
        }

        .conversation-avatar {
            width: 40px;
            height: 40px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--green-900);
            color: var(--white);

            font-size: 13px;
            font-weight: 700;
        }

        .conversation-info {
            min-width: 0;
        }

        .conversation-name {
            margin: 0;

            color: var(--text);

            font-size: 13px;
            font-weight: 650;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-preview {
            margin: 4px 0 0;

            color: var(--text-soft);

            font-size: 11px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* CHAT */

        .chat-panel {
            min-width: 0;

            flex: 1;

            display: flex;
            flex-direction: column;
        }

        .chat-person {
            height: 65px;

            padding: 0 20px;

            display: flex;
            align-items: center;

            gap: 12px;

            border-bottom: 1px solid var(--border);
        }

        .chat-person-avatar {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--green-900);
            color: var(--white);

            font-size: 13px;
            font-weight: 700;
        }

        .chat-person-info h1 {
            margin: 0;

            font-size: 14px;
            font-weight: 650;

            color: var(--green-950);
        }

        .chat-person-info p {
            margin: 3px 0 0;

            color: var(--text-soft);

            font-size: 11px;
        }

        /* MESSAGES */

        .messages {
            flex: 1;

            overflow-y: auto;

            padding: 24px;

            background:
                #fcfbf8;
        }

        .empty-chat {
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            color: var(--text-soft);

            font-size: 13px;
        }

        .message-row {
            display: flex;

            margin-bottom: 14px;
        }

        .message-row.client {
            justify-content: flex-end;
        }

        .message-row.handyman {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: min(70%, 420px);

            padding: 10px 13px;

            border-radius: 8px;

            font-size: 13px;
            line-height: 1.5;
        }

        .message-row.client .message-bubble {
            background: var(--green-900);
            color: var(--white);

            border-bottom-right-radius: 2px;
        }

        .message-row.handyman .message-bubble {
            background: var(--white);
            color: var(--text);

            border:
                1px solid var(--border);

            border-bottom-left-radius: 2px;
        }

        .message-time {
            margin-top: 4px;

            font-size: 9px;

            opacity: 0.55;
        }

        /* INPUT */

        .chat-input-area {
            padding: 13px 15px;

            display: flex;
            align-items: center;

            gap: 10px;

            border-top: 1px solid var(--border);

            background: var(--white);
        }

        .chat-input {
            flex: 1;

            min-height: 43px;

            padding: 0 13px;

            border:
                1px solid var(--border);

            border-radius: 6px;

            outline: none;

            background: var(--cream-light);

            color: var(--text);

            font-size: 13px;
        }

        .chat-input:focus {
            border-color: var(--green-700);

            background: var(--white);
        }

        .send-button {
            width: 43px;
            height: 43px;

            flex-shrink: 0;

            border: 0;
            border-radius: 6px;

            background: var(--green-900);
            color: var(--white);

            font-size: 16px;
            font-weight: 700;
        }

        .send-button:hover {
            background: var(--green-850);
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .chat-header {
                height: 68px;
                padding: 0 18px;
            }

            .chat-logo {
                width: 135px;
            }

            .chat-page {
                min-height:
                    calc(100vh - 68px);

                padding: 0;
            }

            .chat-container {
                height:
                    calc(100vh - 68px);

                min-height: 0;

                border: 0;
                border-radius: 0;

                box-shadow: none;
            }

            .conversation-list {
                display: none;
            }

            .messages {
                padding: 18px;
            }

            .message-bubble {
                max-width: 82%;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="chat-header">

        <a href="client-dashboard.html">
            <img
                src="../assets/handy-logo.png"
                alt="Handy"
                class="chat-logo"
            >
        </a>

        <button
            type="button"
            class="chat-back"
            id="chatBackButton"
        >
            Dashboard
        </button>

    </header>


    <!-- CHAT -->

    <main class="chat-page">

        <div class="chat-container">

            <!-- CONVERSATIONS -->

            <aside class="conversation-list">

                <div class="conversation-header">
                    <h2>Messages</h2>
                </div>

                <div
                    class="conversation-items"
                    id="conversationItems"
                ></div>

            </aside>


            <!-- CHAT PANEL -->

            <section class="chat-panel">

                <div class="chat-person">

                    <div
                        class="chat-person-avatar"
                        id="chatPersonAvatar"
                    >
                        H
                    </div>

                    <div class="chat-person-info">

                        <h1 id="chatPersonName">
                            Select a handyman
                        </h1>

                        <p id="chatPersonStatus">
                            Messages
                        </p>

                    </div>

                </div>


                <!-- MESSAGES -->

                <div
                    class="messages"
                    id="messages"
                >
                    <div class="empty-chat">
                        Select a conversation to start chatting.
                    </div>
                </div>


                <!-- INPUT -->

                <form
                    class="chat-input-area"
                    id="chatForm"
                >

                    <input
                        type="text"
                        id="chatInput"
                        class="chat-input"
                        placeholder="Write a message..."
                        autocomplete="off"
                        maxlength="500"
                    >

                    <button
                        type="submit"
                        class="send-button"
                        aria-label="Send message"
                    >
                        ↑
                    </button>

                </form>

            </section>

        </div>

    </main>


    <script type="module" src="../auth.js"></script>
    <script src="chat.js"></script>

</body>
</html>
