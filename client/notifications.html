<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notifications | Handy</title>

    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --green-950: #10251d;
            --green-900: #17382b;
            --green-850: #1c4434;
            --green-700: #2e624c;

            --cream: #f4f1e9;
            --cream-light: #faf9f5;
            --white: #ffffff;

            --text: #17231e;
            --text-soft: #66716b;
            --text-light: #9aa39d;

            --border: rgba(23, 56, 43, 0.13);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: var(--cream-light);
            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        /* =====================================================
           HEADER
           ===================================================== */

        .notification-header {
            width: 100%;
            min-height: 76px;

            padding: 0 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: var(--cream-light);

            border-bottom: 1px solid var(--border);
        }

        .notification-logo {
            width: 165px;
            display: block;
        }

        .notification-back {
            min-height: 40px;

            padding: 0 15px;

            border: 1px solid var(--border);
            border-radius: 6px;

            background: var(--white);
            color: var(--green-900);

            font-size: 12px;
            font-weight: 650;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .notification-back:hover {
            background: var(--cream);
            transform: translateY(-1px);
        }

        /* =====================================================
           MAIN
           ===================================================== */

        .notification-page {
            width: 100%;
            min-height: calc(100vh - 76px);

            padding: 50px 20px 80px;

            display: flex;
            justify-content: center;
        }

        .notification-wrapper {
            width: 100%;
            max-width: 760px;
        }

        /* =====================================================
           INTRO
           ===================================================== */

        .notification-intro {
            margin-bottom: 25px;
        }

        .notification-label {
            margin: 0 0 7px;

            color: var(--green-700);

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .notification-intro-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            gap: 20px;
        }

        .notification-intro h1 {
            margin: 0;

            color: var(--green-950);

            font-size: 34px;
            line-height: 1.1;

            letter-spacing: -0.04em;
        }

        .mark-all-button {
            min-height: 38px;

            padding: 0 13px;

            border: 1px solid var(--border);
            border-radius: 6px;

            background: var(--white);
            color: var(--green-900);

            font-size: 11px;
            font-weight: 650;

            white-space: nowrap;
        }

        .mark-all-button:hover {
            background: var(--cream);
        }

        .notification-description {
            max-width: 560px;

            margin: 10px 0 0;

            color: var(--text-soft);

            font-size: 13px;
            line-height: 1.6;
        }

        /* =====================================================
           NOTIFICATION CARD
           ===================================================== */

        .notification-card {
            overflow: hidden;

            background: var(--white);

            border: 1px solid var(--border);
            border-radius: 10px;

            box-shadow:
                0 18px 50px
                rgba(16, 37, 29, 0.07);
        }

        /* =====================================================
           FILTER
           ===================================================== */

        .notification-filter {
            min-height: 56px;

            padding: 0 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid var(--border);
        }

        .notification-count {
            color: var(--text-soft);

            font-size: 11px;
        }

        .filter-buttons {
            display: flex;
            gap: 5px;
        }

        .filter-button {
            min-height: 31px;

            padding: 0 10px;

            border: 0;
            border-radius: 5px;

            background: transparent;
            color: var(--text-soft);

            font-size: 11px;
            font-weight: 600;
        }

        .filter-button.active {
            background: var(--cream);
            color: var(--green-900);
        }

        /* =====================================================
           LIST
           ===================================================== */

        .notification-list {
            min-height: 250px;
        }

        .notification-item {
            position: relative;

            padding: 20px 25px;

            display: flex;

            gap: 14px;

            border-bottom: 1px solid var(--border);

            background: var(--white);

            transition:
                background 0.2s ease;
        }

        .notification-item:hover {
            background: #fdfcf9;
        }

        .notification-item.unread {
            background: #fbfcfa;
        }

        .notification-item.unread::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 3px;

            background: var(--green-700);
        }

        .notification-icon {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--cream);

            color: var(--green-900);

            font-size: 12px;
            font-weight: 700;
        }

        .notification-content {
            min-width: 0;
            flex: 1;
        }

        .notification-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;

            gap: 15px;
        }

        .notification-title {
            margin: 0;

            color: var(--green-950);

            font-size: 13px;
            font-weight: 650;

            line-height: 1.4;
        }

        .notification-time {
            flex-shrink: 0;

            color: var(--text-light);

            font-size: 10px;
        }

        .notification-message {
            margin: 5px 0 0;

            color: var(--text-soft);

            font-size: 12px;
            line-height: 1.55;
        }

        .notification-status {
            margin-top: 8px;

            display: inline-block;

            color: var(--green-700);

            font-size: 10px;
            font-weight: 650;

            text-transform: capitalize;
        }

        /* =====================================================
           EMPTY
           ===================================================== */

        .notification-empty {
            min-height: 300px;

            padding: 40px 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .notification-empty-inner {
            max-width: 360px;
        }

        .notification-empty-mark {
            width: 48px;
            height: 48px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--cream);

            color: var(--green-900);

            font-size: 15px;
            font-weight: 700;
        }

        .notification-empty h2 {
            margin: 0;

            color: var(--green-950);

            font-size: 16px;
        }

        .notification-empty p {
            margin: 7px 0 0;

            color: var(--text-soft);

            font-size: 12px;
            line-height: 1.6;
        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 650px) {

            .notification-header {
                min-height: 68px;
                padding: 0 18px;
            }

            .notification-logo {
                width: 135px;
            }

            .notification-page {
                min-height:
                    calc(100vh - 68px);

                padding:
                    35px 13px 55px;
            }

            .notification-intro-row {
                align-items: flex-start;
                flex-direction: column;

                gap: 14px;
            }

            .notification-intro h1 {
                font-size: 29px;
            }

            .mark-all-button {
                width: 100%;
            }

            .notification-filter {
                min-height: 52px;

                padding: 0 17px;
            }

            .notification-item {
                padding: 17px;
            }

            .notification-title-row {
                flex-direction: column;

                gap: 3px;
            }

            .notification-time {
                order: 2;
            }

            .notification-icon {
                width: 35px;
                height: 35px;
            }
        }
    </style>
</head>

<body>

    <header class="notification-header">

        <a href="client-dashboard.html">
            <img
                src="../assets/handy-logo.png"
                alt="Handy"
                class="notification-logo"
            >
        </a>

        <button
            type="button"
            class="notification-back"
            id="notificationBackButton"
        >
            Dashboard
        </button>

    </header>


    <main class="notification-page">

        <div class="notification-wrapper">

            <section class="notification-intro">

                <p class="notification-label">
                    Handy
                </p>

                <div class="notification-intro-row">

                    <h1>
                        Notifications
                    </h1>

                    <button
                        type="button"
                        class="mark-all-button"
                        id="markAllReadButton"
                    >
                        Mark all as read
                    </button>

                </div>

                <p class="notification-description">
                    Stay updated with your bookings,
                    messages, and account activity.
                </p>

            </section>


            <section class="notification-card">

                <div class="notification-filter">

                    <span
                        class="notification-count"
                        id="notificationCount"
                    >
                        0 notifications
                    </span>

                    <div class="filter-buttons">

                        <button
                            type="button"
                            class="filter-button active"
                            data-filter="all"
                        >
                            All
                        </button>

                        <button
                            type="button"
                            class="filter-button"
                            data-filter="unread"
                        >
                            Unread
                        </button>

                    </div>

                </div>


                <div
                    class="notification-list"
                    id="notificationList"
                ></div>

            </section>

        </div>

    </main>


    <script type="module" src="../auth.js"></script>
    <script src="notifications.js"></script>

</body>
</html>
